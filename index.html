<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Rock Finder">
<meta name="theme-color" content="#b4532a">
<title>Rock Finder — what rocks & crystals are here?</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#f6f3ee; --panel:#fffdf9; --ink:#2b2622; --muted:#6f655c; --line:#e3dcd2;
    --accent:#b4532a; --accent2:#3d6b5a; --chip:#efe8de;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1917; --panel:#24211e; --ink:#eee7de; --muted:#a99d90; --line:#3a3530; --chip:#322d29; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;gap:.5rem;align-items:center;padding:.6rem .8rem;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header h1{font-size:1.05rem;margin:0 .5rem 0 0;white-space:nowrap}
  header h1 span{color:var(--accent)}
  form{display:flex;flex:1;gap:.4rem;min-width:240px}
  input[type=search]{flex:1;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  button{padding:.5rem .75rem;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
  button.ghost{background:var(--chip);color:var(--ink)}
  button:disabled{opacity:.6;cursor:default}
  main{display:grid;grid-template-columns:1fr 440px;height:calc(100% - 56px)}
  #map{height:100%;min-height:300px}
  #panel{overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:1rem}
  @media (max-width:820px){
    main{grid-template-columns:1fr;grid-template-rows:45vh auto;height:auto}
    #map{height:45vh}
    #panel{border-left:0;border-top:1px solid var(--line)}
  }
  .muted{color:var(--muted)}
  .small{font-size:.85rem}
  h2{font-size:1.1rem;margin:.2rem 0 .5rem}
  h3{font-size:.95rem;margin:1.2rem 0 .5rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .unit{border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;margin:.5rem 0;display:flex;gap:.7rem}
  .swatch{width:14px;border-radius:4px;flex:none}
  .unit b{display:block}
  .chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0}
  .chip{background:var(--chip);border-radius:999px;padding:.15rem .6rem;font-size:.82rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.7rem}
  .card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
  .card .img{aspect-ratio:4/3;background:var(--chip) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem}
  .card .body{padding:.55rem .65rem .7rem;flex:1;display:flex;flex-direction:column;gap:.25rem}
  .card .body b{font-size:.95rem}
  .card .tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2);font-weight:600}
  .card p{margin:0;font-size:.84rem;color:var(--muted)}
  .card .links{margin-top:auto;display:flex;gap:.6rem;font-size:.8rem;padding-top:.3rem}
  a{color:var(--accent)}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:.4rem}
  .gallery a{display:block;aspect-ratio:1;background:var(--chip) center/cover no-repeat;border-radius:6px}
  .note{background:var(--chip);border-radius:10px;padding:.6rem .8rem;font-size:.85rem;margin-top:1rem}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:.4rem}
  @keyframes spin{to{transform:rotate(360deg)}}
  .layerctl{background:var(--panel);color:var(--ink);padding:.4rem .6rem;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.25);font-size:.85rem}
  .layerctl label{display:flex;gap:.4rem;align-items:center;cursor:pointer}
  .meter{display:flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:600}
  .meter .bars{display:flex;gap:2px}
  .meter .bars i{display:block;width:12px;height:7px;border-radius:2px}
  .tipsbtn{margin-top:.35rem;background:var(--accent2);font-size:.82rem;padding:.4rem .5rem}
  #tips{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:2000;align-items:flex-end;justify-content:center}
  #tips.open{display:flex}
  #tipsSheet{background:var(--panel);color:var(--ink);width:min(560px,100%);max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:1rem 1.1rem 1.6rem;position:relative}
  @media (min-width:821px){#tips{align-items:center}#tipsSheet{border-radius:16px}}
  #tipsClose{position:sticky;top:0;float:right;background:var(--chip);color:var(--ink);border-radius:999px;width:36px;height:36px;padding:0;font-size:1.1rem}
  .tipimg{display:block;aspect-ratio:16/9;background:var(--chip) center/cover no-repeat;border-radius:10px;margin-bottom:.4rem}
  #tipGal{margin-bottom:.6rem}
  #tipsSheet .tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2);font-weight:600}
  #tipsSheet p{margin:.3rem 0}
  #tipsSheet ul{padding-left:1.1rem;margin:.3rem 0}
</style>
</head>
<body>
<header>
  <h1>Rock <span>Finder</span></h1>
  <form id="searchForm">
    <input id="q" type="search" placeholder="Search a place (e.g. Moab, Utah)" aria-label="Search a place">
    <button type="submit">Go</button>
    <button type="button" class="ghost" id="locBtn" title="Use my location">📍</button>
  </form>
</header>
<main>
  <div id="map"></div>
  <section id="panel">
    <h2>Tap anywhere on the map</h2>
    <p class="muted">Rock Finder looks up the mapped geology at that spot, shows the rock types there, and the minerals and crystals commonly found in them, with real specimen photos.</p>
    <p class="muted small">Geology data: Macrostrat (CC-BY 4.0). Photos: Wikipedia / Wikimedia Commons.</p>
  </section>
</main>
<div id="tips" role="dialog" aria-modal="true" aria-label="Identification tips"><div id="tipsSheet"><button type="button" id="tipsClose" aria-label="Close">✕</button><div id="tipsBody"></div></div></div>

<script>

/* Forgiving place search: tries several spellings and two search services */
async function geocode(q){
  const variants=[q];
  const cleaned=q.replace(/\b(lake ?bed|lakebed|bed|area|the)\b/gi,' ').replace(/\s+/g,' ').trim();
  if(cleaned && cleaned.toLowerCase()!==q.toLowerCase()) variants.push(cleaned);
  if(/\bdry lake\b/i.test(cleaned)) variants.push(cleaned.replace(/\bdry lake\b/i,'Lake'));
  for(const v of variants){
    try{
      const j=await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(v))).json();
      if(j.length) return {lat:+j[0].lat,lng:+j[0].lon,name:j[0].display_name};
    }catch(e){}
  }
  for(const v of variants){
    try{
      const j=await (await fetch('https://photon.komoot.io/api/?limit=1&q='+encodeURIComponent(v))).json();
      const f=j.features&&j.features[0];
      if(f){const p=f.properties||{};
        return {lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],
          name:[p.name,p.county||p.city,p.state].filter(Boolean).join(', ')};}
    }catch(e){}
  }
  return null;
}

});

/* ---------- Core lookup ---------- */
async function lookup(lat,lng,label){
  const my=++reqId;
  if(marker) marker.setLatLng([lat,lng]); else marker=L.marker([lat,lng]).addTo(map);
  const where = label ? esc(label) : `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  setPanel(`<h2>${where}</h2><p><span class="spinner"></span>Reading the geologic map…</p>`);
  let units=[];
  try{
    const r=await fetch(`https://macrostrat.org/api/v2/geologic_units/map?lat=${lat}&lng=${lng}`);
    const j=await r.json();
    units=(j.success&&j.success.data)||[];
  }catch(err){
    if(my!==reqId) return;
    setPanel(`<h2>${where}</h2><p>Couldn't reach the geology service: ${esc(err.message)}</p>`);return;
  }
  if(my!==reqId) return;
  if(!units.length){
    setPanel(`<h2>${where}</h2><p>No mapped geology here — this may be water or outside map coverage. Try another spot.</p>`);return;
  }
  // Prefer most detailed scale first
  const order={large:0,medium:1,small:2,tiny:3};
  units.sort((a,b)=>(order[a.scale]??4)-(order[b.scale]??4));
  // dedupe by name+lith
  const seen=new Set(); units=units.filter(u=>{const k=(u.name||'')+'|'+(u.lith||'');if(seen.has(k))return false;seen.add(k);return true;}).slice(0,4);

  // ---- Match rock types and rate how much of each is mapped here ----
  const found=new Map();
  units.forEach((u,ui)=>{
    const lith=(u.lith||'').toLowerCase();
    const text=[u.lith,u.name,u.strat_name,u.descrip].filter(Boolean).join(' ').toLowerCase();
    const majI=lith.indexOf('major'), minI=lith.indexOf('minor');
    ROCKS.forEach(rk=>{
      const m=text.match(rk.re); if(!m) return;
      const p=lith.search(rk.re);
      let role;
      if(p<0) role='mentioned';
      else if(majI>=0||minI>=0){
        role = (minI>=0 && p>minI && (majI<0||majI<minI||p<majI)) ? 'minor' : 'major';
      } else {
        const firstItem=lith.split(/[,;]| and | or |\//)[0];
        role = firstItem.search(rk.re)>=0 ? 'major' : 'minor';
      }
      let level = role==='major'?3 : role==='minor'?2 : 1;
      if(ui>0) level=Math.max(1,level-1);          // less-detailed map or nearby unit
      const rank = (3-level)*1000 + ui*100 + (p>=0?p/10:50);
      const prev=found.get(rk.id);
      if(!prev||prev.rank>rank) found.set(rk.id,{rock:rk,level,role,ui,rank});
    });
  });
  const rocks=[...found.values()].sort((a,b)=>a.rank-b.rank).slice(0,6);

  // ---- Minerals: combine rock likelihood with how common the mineral is in that rock ----
  const ABW={c:3,o:2,r:1}, ABT={c:'Common',o:'Occasional',r:'Rare'};
  const minMap=new Map();
  rocks.forEach(f=>parseMinerals(f.rock).forEach(([m,a])=>{
    if(rocks.some(r=>r.rock.wiki===m)) return;
    const s=f.level+ABW[a];
    const why=`${ABT[a]} in ${f.rock.name} (${ROLE_TXT(f)})`;
    const prev=minMap.get(m);
    if(!prev) minMap.set(m,{name:m,score:s,whys:[why]});
    else { prev.whys.push(why); if(s>prev.score) {prev.score=s; prev.whys.unshift(prev.whys.pop());} }
  }));
  const minerals=[...minMap.values()].sort((a,b)=>b.score-a.score||b.whys.length-a.whys.length).slice(0,12);

  renderResults(where,lat,lng,units,rocks,minerals);
  loadImages([...rocks.map(r=>r.rock.wiki),...minerals.map(m=>m.name)],my);
}

function parseMinerals(rk){ return rk.minerals.split(',').map(s=>{const i=s.lastIndexOf(':');return [s.slice(0,i),s.slice(i+1)];}); }
function ROLE_TXT(f){
  const base = f.role==='major'?'a main rock mapped here' : f.role==='minor'?'a minor rock mapped here' : 'mentioned in the map description';
  return f.ui>0 ? base.replace('mapped here','in a broader map of the area') : base;
}
/* Likelihood scale: 5 = very likely … 1 = rare */
const LIKE=[null,
  {t:'Rare',c:'#9a8f85'},{t:'Uncommon',c:'#c28a3a'},{t:'Possible',c:'#c9a227'},{t:'Likely',c:'#6f9a4a'},{t:'Very likely',c:'#3d7a52'}];
function rockBars(level){return level===3?5:level===2?4:2;}
function minBars(score){return Math.max(1,Math.min(5,score-1));}
function meter(n){
  const L=LIKE[n];
  return `<div class="meter" title="Estimated likelihood"><span class="bars">${[1,2,3,4,5].map(i=>`<i style="background:${i<=n?L.c:'var(--line)'}"></i>`).join('')}</span><span style="color:${L.c}">${L.t}</span></div>`;
}

/* ---------- Rendering ---------- */
const INFO={};   // details for the Tips panel, keyed by wiki title
function renderResults(where,lat,lng,units,rocks,minerals){
  const unitHtml=units.map(u=>{
    const age=[u.b_int_name,u.t_int_name].filter(Boolean);
    const ageTxt = age.length? (age[0]===age[1]||age.length===1? age[0] : `${age[0]} → ${age[1]}`) : '';
    const ma = (u.b_int_age!=null) ? ` · ${fmtAge(u.b_int_age)}${u.t_int_age!=null&&u.t_int_age!==u.b_int_age?'–'+fmtAge(u.t_int_age):''}` : '';
    return `<div class="unit"><div class="swatch" style="background:${esc(u.color||'#999')}"></div><div>
      <b>${esc(u.name||u.strat_name||'Unnamed unit')}</b>
      ${ageTxt?`<div class="small muted">${esc(ageTxt)}${ma}</div>`:''}
      ${u.lith?`<div class="small"><i>${esc(u.lith)}</i></div>`:''}
      ${u.descrip?`<div class="small muted">${esc(trim(u.descrip,260))}</div>`:''}
    </div></div>`;}).join('');

  rocks.forEach(f=>{INFO[f.rock.wiki]={name:f.rock.name,tag:f.rock.kind,bars:rockBars(f.level),
    why:[`${f.rock.name} is ${ROLE_TXT(f)}.`]};});
  minerals.forEach(m=>{INFO[m.name]={name:MINERAL_LABEL(m.name),tag:'Mineral / crystal',bars:minBars(m.score),why:m.whys.map(w=>w+'.')};});

  const rockHtml = rocks.length? `<div class="grid">${rocks.map(f=>card(f.rock.wiki,f.rock.name,f.rock.kind,f.rock.desc,rockBars(f.level))).join('')}</div>`
    : `<p class="muted">The map description didn't match a rock type in Rock Finder's list. See the unit details above.</p>`;
  const minHtml = minerals.length? `<div class="grid">${minerals.map(m=>card(m.name,MINERAL_LABEL(m.name),'Mineral / crystal',(MINERALS[m.name]||[''])[0],minBars(m.score))).join('')}</div>`:'';

  setPanel(`<h2>${where}</h2>
    <p class="small muted">${lat.toFixed(4)}, ${lng.toFixed(4)} ·
      <a href="https://www.mindat.org/search.php?search=${encodeURIComponent(where)}" target="_blank" rel="noopener">Mindat localities</a> ·
      <a href="https://ngmdb.usgs.gov/mapview/?center=${lng},${lat}&zoom=12" target="_blank" rel="noopener">USGS MapView</a></p>
    <h3>Mapped geology here</h3>${unitHtml}
    <h3>Rock types</h3>${rockHtml}
    ${minHtml?`<h3>Minerals & crystals you might find</h3>${minHtml}`:''}
    <div class="note"><b>About the likelihood ratings:</b> they're estimates, not measured odds. Each rating combines how much of a rock is mapped at this spot (main rock, minor rock, or only mentioned) with how common the mineral is in that rock type. No database records real "chance of finding" figures. Exposure, weathering and past collecting all change what's actually on the ground.<br><br>Check land ownership and rules first: collecting is banned in national parks and needs permission on private land.</div>
    <p class="small muted">Geology: <a href="https://macrostrat.org" target="_blank" rel="noopener">Macrostrat</a> (CC-BY 4.0) and its source maps. Photos: Wikipedia / Wikimedia Commons; tap a photo for its credits and license.</p>`);
}

function card(wiki,name,tag,desc,bars){
  const id='img-'+slug(wiki);
  return `<div class="card">
    <a class="img" id="${id}" href="https://en.wikipedia.org/wiki/${encodeURIComponent(wiki.replace(/ /g,'_'))}" target="_blank" rel="noopener">loading photo…</a>
    <div class="body"><span class="tag">${esc(tag)}</span><b>${esc(name)}</b>
      ${meter(bars)}
      ${desc?`<p>${esc(desc)}</p>`:''}
      <button type="button" class="tipsbtn" data-tips="${esc(wiki)}">🔍 How to identify & find</button>
      <div class="gallery" id="gal-${slug(wiki)}"></div>
      <div class="links">
        <a href="#" data-more="${esc(wiki)}">More photos</a>
        <a href="https://www.mindat.org/search.php?search=${encodeURIComponent(MINERAL_LABEL(wiki))}" target="_blank" rel="noopener">Mindat</a>
      </div></div></div>`;
}

document.getElementById('panel').addEventListener('click',e=>{
  const t=e.target.closest('[data-tips]');
  if(t){ openTips(t.dataset.tips); return; }
  const a=e.target.closest('a[data-more]'); if(!a) return;
  e.preventDefault(); a.textContent='Loading…'; morePhotos(a.dataset.more).then(()=>a.remove());
});

/* ---------- Tips pop-out ---------- */
function openTips(wiki){
  const info=INFO[wiki]||{name:MINERAL_LABEL(wiki),tag:'',bars:3,why:[]};
  const tip=TIPS[wiki]||{};
  document.getElementById('tipsBody').innerHTML=`
    <a class="tipimg" id="tipImg" href="https://en.wikipedia.org/wiki/${encodeURIComponent(wiki.replace(/ /g,'_'))}" target="_blank" rel="noopener"></a>
    <div class="gallery" id="tipGal"></div>
    <span class="tag">${esc(info.tag)}</span>
    <h2 style="margin:.2rem 0">${esc(info.name)}</h2>
    ${meter(info.bars)}
    ${info.why.length?`<p class="small muted">Why this rating: ${info.why.map(esc).join(' ')}</p>`:''}
    <h3>How to identify it</h3><p>${esc(tip.id||'See the Mindat page for identification details.')}</p>
    <h3>Where & how to look</h3><p>${esc(tip.find||'Look where its host rock is exposed: road cuts, washes, cliffs and stream gravels.')}</p>
    <h3>Quick field tests</h3><ul class="small">
      <li><b>Hardness:</b> a fingernail is about 2.5, a copper coin about 3.5, a steel knife or glass about 5.5. If the specimen scratches glass, it's harder than 5.5.</li>
      <li><b>Streak:</b> rub it on the back of an unglazed tile and check the color of the powder.</li>
      <li><b>Fizz test:</b> a drop of vinegar bubbles slowly on calcite and limestone.</li>
      <li><b>Magnet:</b> magnetite sticks; hematite and pyrite don't.</li></ul>
    <p class="small"><a href="https://www.mindat.org/search.php?search=${encodeURIComponent(info.name)}" target="_blank" rel="noopener">More on Mindat</a> · <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(wiki.replace(/ /g,'_'))}" target="_blank" rel="noopener">Wikipedia</a></p>`;
  document.getElementById('tips').classList.add('open');
  document.getElementById('tipsSheet').scrollTop=0;
  // main photo (already loaded for the card, or fetch it now)
  const showMain=u=>{const el=document.getElementById('tipImg'); if(el&&tipsFor===wiki){ if(u) el.style.backgroundImage="url('"+u+"')"; else el.style.display='none'; }};
  tipsFor=wiki;
  if(PHOTO[wiki]) showMain(PHOTO[wiki]);
  else fetch('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=640&titles='+encodeURIComponent(wiki))
    .then(r=>r.json()).then(j=>{const pg=Object.values((j.query&&j.query.pages)||{})[0]; const u=pg&&pg.thumbnail&&pg.thumbnail.source; if(u) PHOTO[wiki]=u; showMain(u);})
    .catch(()=>showMain(null));
  // extra specimen photos
  commonsPhotos(MINERAL_LABEL(wiki)).then(list=>{
    const g=document.getElementById('tipGal'); if(!g||tipsFor!==wiki) return;
    g.innerHTML=list.slice(0,6).map(galleryLink).join('');
  }).catch(()=>{});
}
let tipsFor=null;
function closeTips(){document.getElementById('tips').classList.remove('open');}
document.getElementById('tips').addEventListener('click',e=>{ if(e.target.id==='tips'||e.target.closest('#tipsClose')) closeTips(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeTips(); });


/* ---------- Photos: Wikipedia lead images (one batched request) ---------- */
const PHOTO={};   // wiki title -> photo URL
async function loadImages(titles,my){
  titles=[...new Set(titles)];
  for(let i=0;i<titles.length;i+=40){
    const batch=titles.slice(i,i+40);
    try{
      const url='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=480&titles='+encodeURIComponent(batch.join('|'));
      const j=await (await fetch(url)).json();
      if(my!==reqId) return;
      const q=j.query||{}; const back={};
      (q.normalized||[]).forEach(n=>back[n.to]=n.from);
      (q.redirects||[]).forEach(n=>back[n.to]=back[n.from]||n.from);
      Object.values(q.pages||{}).forEach(p=>{
        const orig=back[p.title]||p.title;
        const el=document.getElementById('img-'+slug(orig)); if(!el) return;
        if(p.thumbnail){PHOTO[orig]=p.thumbnail.source; el.style.backgroundImage="url('"+p.thumbnail.source+"')";el.textContent='';}
        else el.textContent='no photo — try More photos';
      });
    }catch(err){ batch.forEach(t=>{const el=document.getElementById('img-'+slug(t)); if(el) el.textContent='photo unavailable';}); }
  }
}

/* ---------- More photos: Wikimedia Commons search ---------- */
async function commonsPhotos(term){
  const url='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=6'
    +'&gsrsearch='+encodeURIComponent(`${term} specimen filetype:bitmap`)+'&prop=imageinfo&iiprop=url&iiurlwidth=240';
  const j=await (await fetch(url)).json();
  return Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index).filter(p=>p.imageinfo);
}
function galleryLink(p){
  const ii=p.imageinfo[0];
  return `<a href="${esc(ii.descriptionurl)}" target="_blank" rel="noopener" title="${esc(p.title)}" style="background-image:url('${esc(ii.thumburl||ii.url)}')"></a>`;
}
async function morePhotos(wiki){
  const gal=document.getElementById('gal-'+slug(wiki)); if(!gal) return;
  try{
    const pages=await commonsPhotos(MINERAL_LABEL(wiki));
    if(!pages.length){gal.outerHTML='<p class="small muted">No more photos found.</p>';return;}
    gal.innerHTML=pages.map(galleryLink).join('');
  }catch(err){gal.outerHTML='<p class="small muted">Couldn\'t load more photos.</p>';}
}

/* ---------- helpers ---------- */
function setPanel(h){document.getElementById('panel').innerHTML=h;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-');}
function trim(s,n){return s.length>n?s.slice(0,n-1)+'…':s;}
function fmtAge(ma){ma=+ma; return ma>=1000? (ma/1000).toFixed(2).replace(/\.?0+$/,'')+' billion yrs' : ma>=1? Math.round(ma)+' million yrs' : Math.round(ma*1000)+',000 yrs';}
